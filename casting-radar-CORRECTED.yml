name: Matthew Paid Casting Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Scan casting sources and create alerts
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              ["Playbill", "https://playbill.com/jobs?category=Performer"],
              ["BroadwayWorld", "https://www.broadwayworld.com/theatre-auditions/"],
              ["Theatre Bay Area", "https://www.theatrebayarea.org/view-listings/"],
              ["Tuacahn", "https://www.tuacahn.org/auditions/"],
              ["Music Circus / Broadway Sacramento", "https://www.broadwaysacramento.com/participate/auditions/"],
              ["Berkeley Rep", "https://www.berkeleyrep.org/get-involved-5xnz"],
              ["A.C.T.", "https://www.act-sf.org/about-us/opportunities/auditions"],
              ["TheatreWorks Silicon Valley", "https://theatreworks.org/work-with-us/auditions/"],
              ["Oregon Shakespeare Festival", "https://www.osfashland.org/en/work-with-us/audition-information.aspx"],
              ["Marin Theatre", "https://www.marintheatre.org/epa"],
              ["San Francisco Playhouse", "https://sfplayhouse.org/get-involved/casting/"],
              ["Center REP", "https://www.centerrep.org/get-involved/audition"],
              ["B Street Theatre", "https://bstreettheatre.org/auditions/"],
              ["Santa Cruz Shakespeare", "https://santacruzshakespeare.org/auditions/"],
              ["Marin Shakespeare", "https://www.marinshakespeare.org/audition-information/"],
              ["San Francisco Shakespeare Festival", "https://sfshakes.org/join/auditions/"],
              ["North Shore Music Theatre", "https://www.nsmt.org/auditions.html"],
              ["Ogunquit Playhouse", "https://www.ogunquitplayhouse.org/contact-us/auditions/"],
              ["Arizona Broadway Theatre", "https://www.azbroadway.org/auditions"],
              ["5th Avenue Theatre", "https://www.5thavenue.org/about/careers/auditions/"],
              ["La Jolla Playhouse", "https://lajollaplayhouse.org/who-we-are/artists-and-programs/play-submissions-auditions/"],
              ["The Old Globe", "https://www.theoldglobe.org/get-involved/auditions-and-assistant-directors/"],
              ["Portland Center Stage", "https://www.pcs.org/about/casting-and-script-submission"],
              ["South Coast Repertory", "https://www.scr.org/about/about-scr-landing/employment-and-auditions/"],
              ["Barrington Stage", "https://barringtonstageco.org/about-the-company/casting/"],
              ["Denver Center", "https://www.denvercenter.org/about-us/careers/"],
              ["Goodman Theatre", "https://www.goodmantheatre.org/artists-archive/auditions/"],
              ["Steppenwolf", "https://www.steppenwolf.org/about-us/work-with-us/casting/"],
              ["Guthrie Theater", "https://www.guthrietheater.org/about/work-with-us/"],
              ["Shakespeare Theatre Company", "https://www.shakespearetheatre.org/about/careers-and-casting/auditions"],
              ["Cincinnati Playhouse", "https://www.cincyplay.com/about/opportunities/auditions"]
            ];

            // These are used only to test the alert system with legitimate paid listings
            // already identified on Aug 17, 2026. Each URL is de-duplicated through Issues.
            const current = [
              ["CURRENT — CORDUROY — Dallas Children's Theatre", "https://www.broadwayworld.com/equity-audition/CORDUROY-Dallas-Children-s-Theatre-2026-51720", "$439 weekly minimum; Equity EPA; Dallas; audition Aug 17, 2026."],
              ["CURRENT — THE WIGGLES — Henry the Octopus", "https://playbill.com/job/charlotte-nc-wiggles-concert-seeks-meet-greet-performers-monday-august-17/ac1f312e-88f0-45c9-a1d4-9082d6dc3442", "$150/day paid live performer; Charlotte; Aug 17, 2026."],
              ["CURRENT — CURIOUS GEORGE: THE GOLDEN MEATBALL — National Tour", "https://playbill.com/job/actors---national-tour-curious-george-the-golden-meatball/cfbf24a7-aae8-43a2-a0fa-c3cb4d300017", "$750–$950/week; non-Equity national tour; Oct 2026–Mar 2027."],
              ["CURRENT — BOX OUT BULLYING — National Tour", "https://playbill.com/job/box-out-bullying-national-tour---non-union-play/de6057ab-79fc-4dfc-9f9b-c046374d8157", "$750/week plus overnight per diem, housing and vehicle; non-Equity national tour."]
            ];

            const relevant = /\b(audition|auditions|casting|cast call|self[- ]?tape|EPA|ECC|general auditions?|national tour|touring|performer|actor|singer|dancer)\b/i;
            const pay = /(\$\s*[\d,]+(?:\.\d+)?\s*(?:\/|per\s+)?(?:hour|hr|day|week|wk|show|performance)|\bpaid\b|salary|hourly|weekly|per performance|per show|equity|SAG[- ]?AFTRA|non[- ]union|non[- ]equity|wage|compensation)/i;
            const bad = /\b(stipend|honorarium|volunteer|unpaid|no pay|deferred|profit share|exposure|pay[- ]?to[- ]?play|voice[- ]?over|voice actor)\b/i;
            const realPay = /(\$\s*[\d,]+(?:\.\d+)?\s*(?:\/|per\s+)?(?:hour|hr|day|week|wk|show|performance)|\b(?:salary|hourly wage|weekly salary|weekly rate|per performance|per show|SAG[- ]?AFTRA|Equity contract|Equity minimum)\b)/i;

            async function getText(url) {
              const r = await fetch(url, {headers: {"User-Agent": "Matthew-Casting-Radar/1.0"}});
              if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
              return await r.text();
            }

            const htmlToText = (s) => s
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/\s+/g, " ");

            const extractLinks = (html, base) => {
              const out = [];
              const re = /href\s*=\s*["']([^"']+)["']/gi;
              let m;
              while ((m = re.exec(html))) {
                try {
                  const u = new URL(m[1], base).href;
                  if (u.startsWith("http")) out.push(u);
                } catch {}
              }
              return [...new Set(out)];
            };

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });

            const existingUrls = new Set();
            for (const issue of existing) {
              for (const match of (issue.body || "").matchAll(/https?:\/\/[^\s)]+/g)) {
                existingUrls.add(match[0]);
              }
            }

            const candidates = [...current.map(x => ({
              title: x[0], url: x[1], details: x[2]
            }))];

            for (const [name, url] of sources) {
              try {
                const raw = await getText(url);
                const links = extractLinks(raw, url).filter(u =>
                  /\/job\/|\/audition|\/auditions|\/casting|\/breakdown|\/jobs\//i.test(u)
                );

                for (const link of links.slice(0, 80)) {
                  if (existingUrls.has(link)) continue;
                  try {
                    const page = htmlToText(await getText(link));
                    if (!relevant.test(page) || !pay.test(page)) continue;
                    if (bad.test(page) && !realPay.test(page)) continue;

                    candidates.push({
                      title: `PAID CASTING — ${name}`,
                      url: link,
                      details: page.slice(0, 5000)
                    });
                  } catch {}
                }
              } catch (e) {
                core.warning(`Could not scan ${name}: ${e.message}`);
              }
            }

            let created = 0;
            for (const c of candidates) {
              if (existingUrls.has(c.url)) continue;

              const body = [
                "## PAID-ONLY CASTING ALERT",
                "",
                c.details,
                "",
                `**Source:** ${c.url}`,
                "",
                "**Included:** actual wages/rates, Equity, SAG-AFTRA, or clearly paid non-union work.",
                "",
                "**Excluded:** stipend, honorarium, volunteer, unpaid, deferred, profit-share, exposure-only, pay-to-play, and voice-over.",
                "",
                "**Geography:** nationwide — travel allowed.",
                "",
                "_Verify the live notice, deadline and role breakdown before applying._"
              ].join("\n");

              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: c.title,
                  body
                });
                existingUrls.add(c.url);
                created++;
                core.info(`Created alert #${issue.data.number}: ${c.title}`);
              } catch (e) {
                core.warning(`Could not create issue for ${c.url}: ${e.message}`);
              }
            }

            core.info(`Casting Radar finished. Created ${created} new alert(s).`);
