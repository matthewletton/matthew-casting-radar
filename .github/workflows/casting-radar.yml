name: Matthew Paid Casting Radar

on:
  schedule:
    - cron: "17 * * * *"   # hourly, 17 minutes past the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Scan public casting sources and create GitHub alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, html, urllib.request, urllib.parse, json, ssl
          from html.parser import HTMLParser

          RELEVANT = re.compile(r"(audition|casting|cast call|self[- ]?tape|epa|ecc|general audition|tour|performer|actor|actress|singer|dancer)", re.I)
          PAY = re.compile(r"(\$[\d,]+(?:\.\d+)?\s*(?:/|per\s+)?(?:hour|hr|day|week|wk|show|performance)|paid|salary|hourly|weekly|per performance|per show|equity|sag[- ]?aftra|non[- ]union|non[- ]equity|wage|compensation)", re.I)
          BAD = re.compile(r"(stipend|honorarium|volunteer|unpaid|no pay|deferred|profit share|exposure|pay[- ]?to[- ]?play|voice[- ]?over|voice actor)", re.I)

          SOURCES = [
            ("Playbill Performer Jobs","https://playbill.com/jobs?category=Performer"),
            ("BroadwayWorld Theatre Auditions","https://www.broadwayworld.com/theatre-auditions/"),
            ("Theatre Bay Area Listings","https://www.theatrebayarea.org/view-listings/"),
            ("Tuacahn Auditions","https://www.tuacahn.org/auditions/"),
            ("Music Circus Auditions","https://www.broadwaysacramento.com/participate/auditions/"),
            ("Berkeley Rep Auditions","https://www.berkeleyrep.org/get-involved-5xnz"),
            ("A.C.T. Auditions","https://www.act-sf.org/about-us/opportunities/auditions"),
            ("TheatreWorks Auditions","https://theatreworks.org/work-with-us/auditions/"),
            ("Oregon Shakespeare Festival","https://www.osfashland.org/en/work-with-us/audition-information.aspx"),
            ("Marin Theatre","https://www.marintheatre.org/epa"),
            ("SF Playhouse Casting","https://sfplayhouse.org/get-involved/casting/"),
            ("Center REP Audition","https://www.centerrep.org/get-involved/audition"),
            ("B Street Auditions","https://bstreettheatre.org/auditions/"),
            ("Santa Cruz Shakespeare","https://santacruzshakespeare.org/auditions/"),
            ("Marin Shakespeare","https://www.marinshakespeare.org/audition-information/"),
            ("SF Shakespeare Festival","https://sfshakes.org/join/auditions/"),
            ("North Shore Music Theatre","https://www.nsmt.org/auditions.html"),
            ("Ogunquit Playhouse","https://www.ogunquitplayhouse.org/contact-us/auditions/"),
            ("Arizona Broadway Theatre","https://www.azbroadway.org/auditions"),
            ("5th Avenue Theatre","https://www.5thavenue.org/about/careers/auditions/"),
            ("La Jolla Playhouse","https://lajollaplayhouse.org/who-we-are/artists-and-programs/play-submissions-auditions/"),
            ("The Old Globe","https://www.theoldglobe.org/get-involved/auditions-and-assistant-directors/"),
            ("Portland Center Stage","https://www.pcs.org/about/casting-and-script-submission"),
            ("South Coast Repertory","https://www.scr.org/about/about-scr-landing/employment-and-auditions/"),
            ("Barrington Stage","https://barringtonstageco.org/about-the-company/casting/"),
            ("Denver Center","https://www.denvercenter.org/about-us/careers/"),
            ("Goodman Theatre","https://www.goodmantheatre.org/artists-archive/auditions/"),
            ("Steppenwolf","https://www.steppenwolf.org/about-us/work-with-us/casting/"),
            ("Guthrie Theater","https://www.guthrietheater.org/about/work-with-us/"),
            ("Shakespeare Theatre Company","https://www.shakespearetheatre.org/about/careers-and-casting/auditions"),
            ("Cincinnati Playhouse","https://www.cincyplay.com/about/opportunities/auditions"),
          ]

          # Current test leads requested on Aug 17, 2026.
          SEED = [
            ("🔥 CURRENT — Corduroy — Dallas Children's Theatre",
             "https://www.broadwayworld.com/equity-audition/CORDUROY-Dallas-Children-s-Theatre-2026-51720",
             "Equity theatre / EPA | Dallas, TX | $439/week minimum | Aug 17–18, 2026"),
            ("🔥 CURRENT — The Wiggles — Henry the Octopus",
             "https://playbill.com/job/charlotte-nc-wiggles-concert-seeks-meet-greet-performers-monday-august-17/ac1f312e-88f0-45c9-a1d4-9082d6dc3442",
             "Paid live performer | Charlotte, NC | $150/day | Aug 17, 2026"),
            ("🔥 CURRENT — Curious George: The Golden Meatball — National Tour",
             "https://playbill.com/job/actors---national-tour-curious-george-the-golden-meatball/cfbf24a7-aae8-43a2-a0fa-c3cb4d300017",
             "Non-Equity national tour | $750–$950/week | Oct 2026–Mar 2027"),
            ("🔥 CURRENT — Box Out Bullying — National Tour",
             "https://playbill.com/job/box-out-bullying-national-tour---non-union-play/de6057ab-79fc-4dfc-9f9b-c046374d8157",
             "Non-Equity tour | Male 20s–30s | $750/week + per diem + housing + vehicle"),
          ]

          class Links(HTMLParser):
              def __init__(self, base):
                  super().__init__()
                  self.base=base; self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="a":
                      d=dict(attrs); h=d.get("href")
                      if h:
                          u=urllib.parse.urljoin(self.base,h)
                          if u.startswith("http"): self.links.append(u)

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Matthew-Casting-Radar/1.0"})
              with urllib.request.urlopen(req,timeout=25,context=ssl.create_default_context()) as r:
                  raw=r.read()
              text=html.unescape(re.sub(r"<[^>]+>"," ",raw.decode("utf-8","ignore")))
              return re.sub(r"\s+"," ",text), raw

          def gh(method,path,data=None):
              req=urllib.request.Request(
                  "https://api.github.com"+path,
                  data=(json.dumps(data).encode() if data else None),
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"},
                  method=method)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.loads(r.read())

          owner=os.environ["GITHUB_REPOSITORY"].split("/")[0]
          repo=os.environ["GITHUB_REPOSITORY"].split("/")[1]

          # Existing issues are our durable de-duplication store.
          existing=gh("GET",f"/repos/{owner}/{repo}/issues?state=all&per_page=100")
          existing_urls=set()
          for i in existing:
              b=i.get("body") or ""
              existing_urls.update(re.findall(r"https?://[^\s)]+",b))

          candidates=list(SEED)

          # Scan source pages for individual listing links.
          for name,url in SOURCES:
              try:
                  text,raw=get(url)
                  if RELEVANT.search(text) and PAY.search(text):
                      # If the page itself is a listing page, keep it as a review alert only
                      # when it changed/has casting + pay signals.
                      if BAD.search(text) and not re.search(r"\b(?:paid|salary|hourly|weekly|equity|sag[- ]?aftra|\$)\b",text,re.I):
                          continue
                      candidates.append((f"New casting signal — {name}",url,text[:2500]))
                  parser=Links(url); parser.feed(raw.decode("utf-8","ignore"))
                  seen=set()
                  for link in parser.links:
                      if link in seen: continue
                      seen.add(link)
                      if any(x in link.lower() for x in ["/job/","/audition","/casting","/breakdown","/jobs/"]):
                          try:
                              t,_=get(link)
                          except Exception:
                              continue
                          if RELEVANT.search(t) and PAY.search(t):
                              if BAD.search(t) and not re.search(r"\b(?:paid|salary|hourly|weekly|equity|sag[- ]?aftra|\$)\b",t,re.I):
                                  continue
                              candidates.append((f"Paid casting — {name}",link,t[:3500]))
              except Exception as e:
                  print("SOURCE ERROR",name,e)

          # Create GitHub Issues for new qualifying URLs. GitHub can notify the account
          # through repository notifications; no assistant message is involved.
          made=0
          for title,url,details in candidates:
              if url in existing_urls: continue
              body=f"""## {title}

**PAID ONLY radar**

{details}

**Source:** {url}

**Filter:** actual wage/rate only. Stipend, honorarium, volunteer, unpaid, deferred, profit-share, exposure-only, pay-to-play, and voice-over are excluded.

**Travel:** nationwide — no geographic exclusion.

*Automated casting-radar alert. Verify the live notice before applying; this issue is not a guarantee that the role remains open.*
"""
              try:
                  gh("POST",f"/repos/{owner}/{repo}/issues",{"title":title[:240],"body":body,"labels":["casting-alert"]})
                  made+=1
                  existing_urls.add(url)
              except Exception as e:
                  print("ISSUE ERROR",e)
          print("Created",made,"new casting alerts.")
          PY
