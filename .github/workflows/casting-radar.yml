name: Matthew Paid Casting Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Scan casting sources
        uses: actions/github-script@v7
        with:
          script: |
            const sources = [
              ["Playbill", "https://playbill.com/jobs?category=Performer"],
              ["BroadwayWorld", "https://www.broadwayworld.com/theatre-auditions/"],
              ["Theatre Bay Area", "https://www.theatrebayarea.org/view-listings/"],
              ["Tuacahn", "https://www.tuacahn.org/auditions/"],
              ["Music Circus / Broadway Sacramento", "https://www.broadwaysacramento.com/participate/auditions/"],
              ["Berkeley Rep", "https://www.berkeleyrep.org/get-involved-5xnz"],
              ["A.C.T.", "https://www.act-sf.org/about-us/opportunities/auditions"],
              ["TheatreWorks Silicon Valley", "https://theatreworks.org/work-with-us/auditions/"],
              ["Oregon Shakespeare Festival", "https://www.osfashland.org/en/work-with-us/audition-information.aspx"],
              ["Marin Theatre", "https://www.marintheatre.org/epa"],
              ["San Francisco Playhouse", "https://sfplayhouse.org/get-involved/casting/"],
              ["Center REP", "https://www.centerrep.org/get-involved/audition"],
              ["B Street Theatre", "https://bstreettheatre.org/auditions/"],
              ["Santa Cruz Shakespeare", "https://santacruzshakespeare.org/auditions/"],
              ["Marin Shakespeare", "https://www.marinshakespeare.org/audition-information/"],
              ["San Francisco Shakespeare Festival", "https://sfshakes.org/join/auditions/"],
              ["San Francisco Opera", "https://www.sfopera.com/about-us/careers/"],
              ["North Shore Music Theatre", "https://www.nsmt.org/auditions.html"],
              ["Ogunquit Playhouse", "https://www.ogunquitplayhouse.org/contact-us/auditions/"],
              ["Arizona Broadway Theatre", "https://www.azbroadway.org/auditions"],
              ["5th Avenue Theatre", "https://www.5thavenue.org/about/careers/auditions/"],
              ["La Jolla Playhouse", "https://lajollaplayhouse.org/who-we-are/artists-and-programs/play-submissions-auditions/"],
              ["The Old Globe", "https://www.theoldglobe.org/get-involved/auditions-and-assistant-directors/"],
              ["Portland Center Stage", "https://www.pcs.org/about/casting-and-script-submission"],
              ["South Coast Repertory", "https://www.scr.org/about/about-scr-landing/employment-and-auditions/"],
              ["Barrington Stage", "https://barringtonstageco.org/about-the-company/casting/"],
              ["Denver Center", "https://www.denvercenter.org/about-us/careers/"],
              ["Goodman Theatre", "https://www.goodmantheatre.org/artists-archive/auditions/"],
              ["Steppenwolf", "https://www.steppenwolf.org/about-us/work-with-us/casting/"],
              ["Guthrie Theater", "https://www.guthrietheater.org/about/work-with-us/"],
              ["Shakespeare Theatre Company", "https://www.shakespearetheatre.org/about/careers-and-casting/auditions"],
              ["Cincinnati Playhouse", "https://www.cincyplay.com/about/opportunities/auditions"],
              ["Backstage public performer jobs", "https://www.backstage.com/actors-and-performers/"],
              ["Backstage public film jobs", "https://www.backstage.com/casting/open-casting-calls/movie-auditions/"],
              ["Casting Networks", "https://www.castingnetworks.com/"]
            ];

            // Public indexing is only a supplement for social media.
            const socialFeeds = [
              ["Social — Instagram", "https://news.google.com/rss/search?q=site%3Ainstagram.com+%28%22casting+call%22+OR+%22open+call%22+OR+%22now+casting%22+OR+%22actors+wanted%22%29+%28paid+OR+%24%29&hl=en-US&gl=US&ceid=US%3Aen"],
              ["Social — Facebook", "https://news.google.com/rss/search?q=site%3Afacebook.com+%28%22casting+call%22+OR+%22open+call%22+OR+%22now+casting%22+OR+%22actors+wanted%22%29+%28paid+OR+%24%29&hl=en-US&gl=US&ceid=US%3Aen"],
              ["Social — TikTok", "https://news.google.com/rss/search?q=site%3Atiktok.com+%28%22casting+call%22+OR+%22open+call%22+OR+%22now+casting%22+OR+%22actors+wanted%22%29+%28paid+OR+%24%29&hl=en-US&gl=US&ceid=US%3Aen"]
            ];

            const relevant = /\b(casting call|open casting|open call|now casting|actors wanted|actor wanted|performers wanted|audition notice|audition|casting|cast call|self[- ]?tape|EPA|ECC|general audition|national tour|touring|performer|actor|singer|dancer)\b/i;
            const paid = /(\$\s*[\d,]+(?:\.\d+)?\s*(?:\/|per\s+)?(?:hour|hr|day|week|wk|show|performance)?|\bpaid\b|salary|hourly|weekly|per performance|per show|Equity|SAG[- ]?AFTRA|wage)/i;
            const forbidden = /\b(stipend|honorarium|volunteer|unpaid|no pay|deferred|profit share|exposure|pay[- ]?to[- ]?play|voice[- ]?over|voice actor)\b/i;
            const articleNoise = /\b(warning|scam|scams|should actors|opinion|editorial|column|footage|viral|goes viral|review|reviews|interview|podcast|news|behind the scenes|history|explainer)\b/i;
            const actionable = /\b(apply|application|submit|submission|self[- ]?tape|deadline|audition|callback|casting call|open call|roles?|role|seeking|looking for|send (?:headshot|resume|reel)|breakdown)\b/i;
            const genderFit = /\b(male|man|men|boy|young man|he\/him|he\/they|non[- ]?binary|gender[- ]?nonconforming|any gender|all genders|gender neutral|gender inclusive)\b/i;
            const ageFit = /\b(?:1[5-9]|2[0-3])\s*(?:-|–|—|to)\s*(?:1[5-9]|2[0-3])\b|\b(?:15|16|17|18|19|20|21|22|23)\s*(?:years? old|yo|y\/o)\b|\b(?:playing|character|role)\s+age\s*[:\-]?\s*(?:1[5-9]|2[0-3])\b/i;
            const raceFit = /\b(white|caucasian|european[- ]?american|white[- ]?passing)\b/i;
            const explicitOtherGender = /\b(female|woman|women|girl|she\/her)\b/i;

            async function get(url) {
              const r = await fetch(url, {headers: {"User-Agent": "Matthew-Casting-Radar/3.0"}});
              if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
              return await r.text();
            }

            function decode(s) {
              return (s || "").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ");
            }

            function textOnly(s) {
              return decode((s || "").replace(/<script[\s\S]*?<\/script>/gi," ")
                .replace(/<style[\s\S]*?<\/style>/gi," ")
                .replace(/<[^>]+>/g," ")
                .replace(/\s+/g," ")).trim();
            }

            function meta(html, key) {
              const re = new RegExp(`<meta[^>]+(?:property|name)=["']${key}["'][^>]+content=["']([^"']+)["']|<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']${key}["']`, "i");
              const m = html.match(re);
              return m ? decode(m[1] || m[2]) : "";
            }

            function titleOf(html) {
              return textOnly(meta(html,"og:title") || meta(html,"twitter:title") ||
                ((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||""));
            }

            function descriptionOf(html) {
              return textOnly(meta(html,"og:description") || meta(html,"description") || "");
            }

            function extractLinks(html, base) {
              const out = [];
              const re = /href\s*=\s*["']([^"']+)["']/gi;
              let m;
              while ((m = re.exec(html))) {
                try {
                  const u = new URL(m[1], base).href;
                  if (u.startsWith("http")) out.push(u);
                } catch {}
              }
              return [...new Set(out)];
            }

            function extractPay(t) {
              const a = t.match(/\$\s*[\d,]+(?:\.\d+)?\s*(?:\/|per\s+)?(?:hour|hr|day|week|wk|show|performance)?/ig) || [];
              const b = t.match(/(?:Equity|SAG[- ]?AFTRA|weekly rate|weekly minimum|per performance|per show|paid)[^.]{0,90}/ig) || [];
              return [...new Set([...a,...b])].slice(0,5).join("; ");
            }

            function extractDates(t) {
              const a = t.match(/(?:audition|submission|deadline|callback|rehearsal|performance)[^.]{0,120}/ig) || [];
              return a.slice(0,3).join(" ");
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "all", per_page: 100
            });

            const existingUrls = new Set();
            for (const i of existing)
              for (const m of (i.body || "").matchAll(/https?:\/\/[^\s)]+/g))
                existingUrls.add(m[0]);

            const candidates = [];

            for (const [source, url] of sources) {
              try {
                const raw = await get(url);
                const links = extractLinks(raw, url)
                  .filter(u => /\/job\/|\/audition|\/auditions|\/casting|\/breakdown|\/jobs\//i.test(u))
                  .slice(0,60);

                for (const link of links) {
                  if (existingUrls.has(link)) continue;
                  try {
                    const page = await get(link);
                    const t = textOnly(page);
                    const title = titleOf(page);
                    const desc = descriptionOf(page);
                    const combined = `${title} ${desc} ${t}`;

                    if (!relevant.test(combined) || !paid.test(combined) || forbidden.test(combined)) continue;
                    // Keep only roles plausibly matching Matthew: male or non-binary,
                    // playing age 15–23, and white/European-presenting when race is specified.
                    // If a notice does not specify gender, age, or race, retain it only when
                    // it is otherwise an explicitly open/general casting notice.
                    const genderSpecified = genderFit.test(combined) || explicitOtherGender.test(combined);
                    const ageSpecified = /\b(?:age|aged|years? old|playing age|character age|role age)\b/i.test(combined);
                    const raceSpecified = /\b(?:race|ethnicity|ethnic|caucasian|white)\b/i.test(combined);
                    if (genderSpecified && explicitOtherGender.test(combined) && !genderFit.test(combined)) continue;
                    if (ageSpecified && !ageFit.test(combined)) continue;
                    if (raceSpecified && !raceFit.test(combined)) continue;
                    if (genderSpecified && !genderFit.test(combined)) continue;
                    if (articleNoise.test(title) || !actionable.test(combined)) continue;

                    candidates.push({source, url: link, title, description: desc, pay: extractPay(t), dates: extractDates(t)});
                  } catch {}
                }
              } catch (e) {
                core.warning(`Could not scan ${source}: ${e.message}`);
              }
            }

            for (const [source, url] of socialFeeds) {
              try {
                const raw = await get(url);
                const items = [...raw.matchAll(/<item>[\s\S]*?<\/item>/gi)].slice(0,30);

                for (const item of items) {
                  const block = item[0];
                  const title = textOnly((block.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>|<title>(.*?)<\/title>/i)||[])[1] ||
                    (block.match(/<title>(.*?)<\/title>/i)||[])[1] || "");
                  const link = decode((block.match(/<link>(.*?)<\/link>/i)||[])[1] || "");
                  const desc = textOnly((block.match(/<description>([\s\S]*?)<\/description>/i)||[])[1] || "");
                  const t = `${title} ${desc}`;

                  if (!link || existingUrls.has(link)) continue;
                  if (!relevant.test(t) || !paid.test(t) || forbidden.test(t)) continue;
                  const genderSpecified = genderFit.test(t) || explicitOtherGender.test(t);
                  const ageSpecified = /\b(?:age|aged|years? old|playing age|character age|role age)\b/i.test(t);
                  const raceSpecified = /\b(?:race|ethnicity|ethnic|caucasian|white)\b/i.test(t);
                  if (genderSpecified && explicitOtherGender.test(t) && !genderFit.test(t)) continue;
                  if (ageSpecified && !ageFit.test(t)) continue;
                  if (raceSpecified && !raceFit.test(t)) continue;
                  if (genderSpecified && !genderFit.test(t)) continue;
                  if (articleNoise.test(title) || !actionable.test(t)) continue;

                  candidates.push({source, url: link, title, description: desc.slice(0,700), pay: extractPay(t), dates: extractDates(t)});
                }
              } catch (e) {
                core.warning(`Could not scan ${source}: ${e.message}`);
              }
            }

            let created = 0;

            for (const c of candidates) {
              if (existingUrls.has(c.url)) continue;

              const title = (c.title || "Paid Casting Opportunity").replace(/\s+/g," ").trim().slice(0,180);
              const body = [
                "## 🎭 PAID CASTING ALERT",
                "",
                `**Production / Notice:** ${title}`,
                `**Source:** ${c.source}`,
                c.description ? `**Summary:** ${c.description}` : "",
                c.pay ? `**Pay evidence:** ${c.pay}` : "**Pay:** Paid language detected — verify the exact rate in the original notice.",
                c.dates ? `**Dates / deadline evidence:** ${c.dates}` : "",
                "",
                "### Apply",
                `[OPEN ORIGINAL CASTING NOTICE](${c.url})`,
                "",
                "### Filters",
                "✅ Paid work",
                "🌎 Nationwide / travel allowed",
                "🚫 Excludes stipend, honorarium, unpaid, deferred/profit-share, pay-to-play and voice-over\n\n🎯 Fit target: male or non-binary roles; playing age 15–23; white/European-presenting when race is specified",
                "",
                "_Verify the live notice, exact compensation, role, eligibility and deadline before applying._"
              ].filter(Boolean).join("\n\n");

              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `🎭 ${title}`, body
                });
                existingUrls.add(c.url);
                created++;
                core.info(`Created alert #${issue.data.number}: ${title}`);
              } catch (e) {
                core.warning(`Could not create issue for ${c.url}: ${e.message}`);
              }
            }

            core.info(`Casting Radar finished. Created ${created} new alert(s).`);
